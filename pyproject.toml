[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grover-research"
version = "0.1.0"
description = "A reproducible implementation and experimental analysis of Grover's quantum search algorithm"
requires-python = ">=3.10"
dependencies = [
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
